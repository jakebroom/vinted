<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Label</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 3mm;
            margin: 0;
            width: 50mm;
            height: 80mm;
            background: white;
        }
        .label {
            width: 100%;
            height: 100%;
        }
        .item-id {
            font-size: 14pt;
            font-weight: bold;
            margin-bottom: 2mm;
            border-bottom: 2px solid black;
            padding-bottom: 1mm;
        }
        .item-name {
            font-size: 11pt;
            font-weight: bold;
            margin-bottom: 3mm;
            line-height: 1.2;
        }
        .item-info {
            font-size: 9pt;
            margin-bottom: 1.5mm;
            line-height: 1.3;
        }
        .price-tag {
            font-size: 16pt;
            font-weight: bold;
            margin-top: 4mm;
            padding: 2mm;
            border: 2px solid black;
            text-align: center;
            background: black;
            color: white;
        }
        .qr-text {
            font-size: 7pt;
            margin-top: 3mm;
            word-break: break-all;
            border: 1px solid black;
            padding: 2mm;
        }
        @media print {
            @page {
                size: 50mm 80mm;
                margin: 0;
            }
            body {
                padding: 3mm;
                margin: 0;
            }
            .label {
                page-break-after: always;
            }
        }
    </style>
</head>
<body>
    <div class="label" id="labelContent">
        Loading...
    </div>

    <script>
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadLabel() {
            try {
                // Get item ID from URL
                const urlParams = new URLSearchParams(window.location.search);
                const itemId = urlParams.get('id');

                if (!itemId) {
                    alert('No item ID provided');
                    return;
                }

                // Fetch item details
                const response = await fetch('/api/items/' + itemId);
                if (!response.ok) throw new Error('Failed to load item');

                const item = await response.json();

                const itemIdFormatted = '#' + String(item.id).padStart(3, '0');
                const price = item.selling_price || item.price;
                const priceFormatted = price ? '£' + parseFloat(price).toFixed(2) : '';

                // Build label HTML
                let html = `
                    <div class="item-id">${itemIdFormatted}${item.item_number ? ' - ' + escapeHtml(item.item_number) : ''}</div>
                    <div class="item-name">${escapeHtml(item.name)}</div>
                    <div class="item-info"><strong>Brand:</strong> ${escapeHtml(item.brand || 'N/A')}</div>
                    <div class="item-info"><strong>Size:</strong> ${escapeHtml(item.size)}${item.collar_size ? ' (Collar: ' + escapeHtml(item.collar_size) + ')' : ''}</div>
                    <div class="item-info"><strong>Color:</strong> ${escapeHtml(item.color)}</div>
                    <div class="item-info"><strong>Condition:</strong> ${escapeHtml(item.condition_item || 'N/A')}</div>
                `;

                if (priceFormatted) {
                    html += `<div class="price-tag">${priceFormatted}</div>`;
                }

                // Add QR link as text
                const qrLink = window.location.origin + '/?item=' + item.id;
                html += `<div class="qr-text">Scan: ${qrLink}</div>`;

                document.getElementById('labelContent').innerHTML = html;

                // Auto-print after a short delay
                setTimeout(function() {
                    window.print();
                }, 500);

            } catch (error) {
                console.error('Error loading label:', error);
                alert('Failed to load item details');
            }
        }

        // Load label when page loads
        window.onload = loadLabel;
    </script>
</body>
</html>
