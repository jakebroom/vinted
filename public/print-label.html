<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Label</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            padding: 0;
            margin: 0;
        }
        .label {
            width: 10cm;
            height: 3cm;
            border: 1px solid #000;
            padding: 2mm;
            display: flex;
            align-items: center;
            gap: 2mm;
        }
        .label-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            overflow: hidden;
        }
        .label-header {
            margin-bottom: 1mm;
        }
        .item-id {
            font-size: 8pt;
            font-weight: bold;
            line-height: 1.1;
        }
        .item-name {
            font-size: 9pt;
            font-weight: bold;
            line-height: 1.1;
            margin-bottom: 1mm;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-details {
            font-size: 6pt;
            line-height: 1.3;
        }
        .detail-row {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .detail-label {
            font-weight: bold;
        }
        .label-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 1mm;
        }
        .qr-container img {
            width: 22mm;
            height: 22mm;
            display: block;
        }
        .price-tag {
            font-size: 8pt;
            font-weight: bold;
            text-align: center;
            background: #000;
            color: #fff;
            padding: 0.5mm 2mm;
            white-space: nowrap;
        }
        @media print {
            @page {
                size: 10cm 3cm;
                margin: 0;
            }
            body {
                padding: 0;
                margin: 0;
            }
            .label {
                border: none;
                page-break-after: always;
            }
        }
    </style>
</head>
<body>
    <div class="label">
        <div class="label-left">
            <div class="label-header">
                <div class="item-id" id="itemId">Loading...</div>
                <div class="item-name" id="itemName"></div>
            </div>
            <div class="item-details" id="itemDetails">
                <!-- Details will be loaded here -->
            </div>
        </div>
        <div class="label-right">
            <div class="qr-container">
                <img id="qrCode" src="" alt="QR Code">
            </div>
            <div class="price-tag" id="price" style="display:none;"></div>
        </div>
    </div>

    <script>
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadLabel() {
            try {
                // Get item ID from URL
                const urlParams = new URLSearchParams(window.location.search);
                const itemId = urlParams.get('id');

                if (!itemId) {
                    alert('No item ID provided');
                    return;
                }

                // Fetch item details
                const response = await fetch('/api/items/' + itemId);
                if (!response.ok) throw new Error('Failed to load item');

                const item = await response.json();

                // Populate label
                document.getElementById('itemId').textContent = '#' + String(item.id).padStart(3, '0');
                document.getElementById('itemName').textContent = item.name;

                // Build details HTML - compact format
                let detailsHTML = '';

                // Line 1: Brand and Size
                let line1 = escapeHtml(item.brand || 'N/A') + ' | Size: ' + escapeHtml(item.size);
                if (item.collar_size) {
                    line1 += ' | Collar: ' + escapeHtml(item.collar_size);
                }
                detailsHTML += '<div class="detail-row">' + line1 + '</div>';

                // Line 2: Color and Condition
                let line2 = escapeHtml(item.color) + ' | ' + escapeHtml(item.condition_item || 'N/A');
                detailsHTML += '<div class="detail-row">' + line2 + '</div>';

                document.getElementById('itemDetails').innerHTML = detailsHTML;

                // Show price if available
                const price = item.selling_price || item.price;
                if (price) {
                    document.getElementById('price').textContent = '£' + parseFloat(price).toFixed(2);
                    document.getElementById('price').style.display = 'block';
                }

                // Generate QR code
                const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' +
                    encodeURIComponent(window.location.origin + '/?item=' + item.id + '&popup=true') +
                    '&bgcolor=ffffff&color=333333&margin=10&format=png';

                document.getElementById('qrCode').src = qrUrl;

                // Wait for QR code to load, then print
                document.getElementById('qrCode').onload = function() {
                    setTimeout(function() {
                        window.print();
                    }, 500);
                };

            } catch (error) {
                console.error('Error loading label:', error);
                alert('Failed to load item details');
            }
        }

        // Load label when page loads
        window.onload = loadLabel;
    </script>
</body>
</html>
