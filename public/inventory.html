<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table View - Vinted Inventory System</title>
    <link rel="stylesheet" href="inventory.css">
    
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 NewStart Inventory System</h1>
            <div class="nav-buttons">
                <button class="btn btn-secondary" onclick="tableApp.showAddItemModal()">➕ Add Item</button>
                <a href="/manage" class="btn btn-secondary">⚙️ Management</a>
                <a href="/insights" class="btn btn-secondary">📈 Insights</a>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats" id="statsContainer">
            <strong>Available: <span id="availableCount">0</span> | Sold: <span id="soldCount">0</span> | Total: <span id="totalCount">0</span></strong>
        </div>

        <!-- Controls -->
        <div class="controls">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search items...">
            <select id="statusFilter" class="filter-select">
                <option value="all">All Items</option>
                <option value="available">Available Only</option>
                <option value="sold">Sold Only</option>
            </select>
            <button class="btn btn-small" onclick="tableApp.exportToCSV()">📄 Export CSV</button>
        </div>

        <!-- Table -->
        <div class="table-container">
            <div class="table-wrapper">
                <table id="inventoryTable">
                    <thead>
                        <tr>
                            <th onclick="tableApp.sortTable('id')">
                                ID <span class="sort-indicator">↕️</span>
                            </th>
                            <th onclick="tableApp.sortTable('name')">
                                Name <span class="sort-indicator">↕️</span>
                            </th>
                            <th onclick="tableApp.sortTable('color')">
                                Color <span class="sort-indicator">↕️</span>
                            </th>
                            <th onclick="tableApp.sortTable('size')">
                                Size <span class="sort-indicator">↕️</span>
                            </th>
                            <th onclick="tableApp.sortTable('brand')" class="hide-mobile">
                                Brand <span class="sort-indicator">↕️</span>
                            </th>
                            <th onclick="tableApp.sortTable('bought_price')">
                                Purchase Price <span class="sort-indicator">↕️</span>
                            </th>
                            <th onclick="tableApp.sortTable('selling_price')">
                                Selling Price <span class="sort-indicator">↕️</span>
                            </th>
                            <th>
                                Profit Margin
                            </th>
                            <th onclick="tableApp.sortTable('condition_item')" class="hide-mobile">
                                Condition <span class="sort-indicator">↕️</span>
                            </th>
                            <th onclick="tableApp.sortTable('location')" class="hide-mobile">
                                Location <span class="sort-indicator">↕️</span>
                            </th>
                            <th onclick="tableApp.sortTable('season')" class="hide-mobile">
                                Season <span class="sort-indicator">↕️</span>
                            </th>
                            <th onclick="tableApp.sortTable('platform')" class="hide-mobile">
                                Platform <span class="sort-indicator">↕️</span>
                            </th>
                            <th onclick="tableApp.sortTable('is_sold')">
                                Status <span class="sort-indicator">↕️</span>
                            </th>
                            <th onclick="tableApp.sortTable('date_added')" class="hide-mobile">
                                Added <span class="sort-indicator">↕️</span>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="14" class="loading">Loading inventory...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Item Detail Modal -->
        <div id="itemModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title" id="modalTitle">Item Details</div>
                    <button class="close" onclick="tableApp.closeModal()">&times;</button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- Item details will be inserted here -->
                </div>
            </div>
        </div>

        <!-- Add Item Modal -->
        <div id="addItemModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title">Add New Item</div>
                    <button class="close" onclick="tableApp.closeAddItemModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="addItemForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="itemName">Item Name *</label>
                                <input type="text" id="itemName" name="name" required>
                            </div>
                            <div class="form-group">
                                <label for="itemColor">Color *</label>
                                <input type="text" id="itemColor" name="color" required>
                            </div>
                            <div class="form-group">
                                <label for="itemSize">Size *</label>
                                <select id="itemSize" name="size" required>
                                    <option value="">Select Size</option>
                                    <option value="XXS">XXS</option>
                                    <option value="XS">XS</option>
                                    <option value="S">S</option>
                                    <option value="M">M</option>
                                    <option value="L">L</option>
                                    <option value="XL">XL</option>
                                    <option value="XXL">XXL</option>
                                    <option value="XXXL">XXXL</option>
                                    <option value="One Size">One Size</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="itemBrand">Brand</label>
                                <input type="text" id="itemBrand" name="brand">
                            </div>
                            <div class="form-group">
                                <label for="itemBoughtPrice">Bought For (£)</label>
                                <input type="number" id="itemBoughtPrice" name="bought_price" step="0.01" min="0">
                            </div>
                            <div class="form-group">
                                <label for="itemSellingPrice">Selling Price (£)</label>
                                <input type="number" id="itemSellingPrice" name="selling_price" step="0.01" min="0">
                            </div>
                            <div class="form-group">
                                <label for="itemCondition">Condition</label>
                                <select id="itemCondition" name="condition_item">
                                    <option value="">Select Condition</option>
                                    <option value="New with tags">New with tags</option>
                                    <option value="New without tags">New without tags</option>
                                    <option value="Very good">Very good</option>
                                    <option value="Good">Good</option>
                                    <option value="Satisfactory">Satisfactory</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="itemLocation">Location</label>
                                <input type="text" id="itemLocation" name="location" placeholder="e.g., Wardrobe A, Drawer 2">
                            </div>
                            <div class="form-group">
                                <label for="itemSeason">Season</label>
                                <select id="itemSeason" name="season">
                                    <option value="">Select Season</option>
                                    <option value="Summer">Summer</option>
                                    <option value="Winter">Winter</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="itemPlatform">Platform</label>
                                <select id="itemPlatform" name="platform">
                                    <option value="Vinted" selected>Vinted</option>
                                    <option value="eBay">eBay</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="itemDescription">Description</label>
                            <textarea id="itemDescription" name="description" placeholder="Additional details about the item..." rows="3"></textarea>
                        </div>
                        <div style="text-align: center; margin-top: 20px;">
                            <button type="submit" class="btn" id="addItemButton">Add Item to Inventory</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        class TableApp {
            constructor() {
                this.items = [];
                this.filteredItems = [];
                this.sortColumn = 'id';
                this.sortDirection = 'asc';
                this.currentFilter = 'all';
                this.searchTerm = '';
                this.init();
            }

            calculateProfitMargin(boughtPrice, sellingPrice) {
                if (!boughtPrice || !sellingPrice) return null;
                
                const bought = parseFloat(boughtPrice);
                const selling = parseFloat(sellingPrice);
                
                if (bought === 0) return selling > 0 ? "∞%" : "0%";
                
                const margin = ((selling - bought) / bought * 100).toFixed(1);
                return `${margin}%`;
            }

            getProfitMarginClass(boughtPrice, sellingPrice) {
                if (!boughtPrice || !sellingPrice) return '';
                
                const bought = parseFloat(boughtPrice);
                const selling = parseFloat(sellingPrice);
                const profit = selling - bought;
                
                if (profit > 0) return 'profit-positive';
                if (profit < 0) return 'profit-negative';
                return 'profit-zero';
            }

            async init() {
                this.bindEvents();
                await this.loadItems();
                await this.loadStats();
            }

            bindEvents() {
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.searchTerm = e.target.value;
                    this.filterAndDisplayItems();
                });

                document.getElementById('statusFilter').addEventListener('change', (e) => {
                    this.currentFilter = e.target.value;
                    this.filterAndDisplayItems();
                });

                document.getElementById('itemModal').addEventListener('click', (e) => {
                    if (e.target.id === 'itemModal') {
                        this.closeModal();
                    }
                });

                document.getElementById('addItemModal').addEventListener('click', (e) => {
                    if (e.target.id === 'addItemModal') {
                        this.closeAddItemModal();
                    }
                });

                document.getElementById('addItemForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleAddItem();
                });
            }

            async apiCall(endpoint, options = {}) {
                try {
                    const response = await fetch(`/api${endpoint}`, {
                        headers: {
                            'Content-Type': 'application/json',
                            ...options.headers
                        },
                        ...options
                    });

                    if (!response.ok) {
                        const error = await response.json().catch(() => ({ error: 'Network error' }));
                        throw new Error(error.error || `HTTP ${response.status}`);
                    }

                    return await response.json();
                } catch (error) {
                    console.error('API Call error:', error);
                    throw error;
                }
            }

            async loadItems() {
                try {
                    this.items = await this.apiCall('/items');
                    this.filterAndDisplayItems();
                } catch (error) {
                    document.getElementById('tableBody').innerHTML = `
                        <tr><td colspan="14" class="empty-state">Error loading items</td></tr>
                    `;
                }
            }

            async loadStats() {
                try {
                    const stats = await this.apiCall('/stats');
                    document.getElementById('totalCount').textContent = stats.totalItems;
                    document.getElementById('availableCount').textContent = stats.availableItems;
                    document.getElementById('soldCount').textContent = stats.soldItems;
                } catch (error) {
                    console.error('Failed to load stats:', error);
                }
            }

            filterAndDisplayItems() {
                let filtered = [...this.items];

                if (this.currentFilter === 'available') {
                    filtered = filtered.filter(item => !item.is_sold);
                } else if (this.currentFilter === 'sold') {
                    filtered = filtered.filter(item => item.is_sold);
                }

                if (this.searchTerm) {
                    const term = this.searchTerm.toLowerCase();
                    filtered = filtered.filter(item =>
                        item.name?.toLowerCase().includes(term) ||
                        item.color?.toLowerCase().includes(term) ||
                        item.size?.toLowerCase().includes(term) ||
                        item.brand?.toLowerCase().includes(term) ||
                        item.description?.toLowerCase().includes(term) ||
                        item.location?.toLowerCase().includes(term) ||
                        item.season?.toLowerCase().includes(term) ||
                        item.platform?.toLowerCase().includes(term)
                    );
                }

                filtered.sort((a, b) => {
                    let aVal = a[this.sortColumn] ?? '';
                    let bVal = b[this.sortColumn] ?? '';

                    if (['bought_price','selling_price','price','id'].includes(this.sortColumn)) {
                        aVal = parseFloat(aVal) || 0;
                        bVal = parseFloat(bVal) || 0;
                    } else if (this.sortColumn === 'is_sold') {
                        aVal = aVal ? 1 : 0;
                        bVal = bVal ? 1 : 0;
                    } else {
                        aVal = aVal.toString().toLowerCase();
                        bVal = bVal.toString().toLowerCase();
                    }

                    if (aVal < bVal) return this.sortDirection === 'asc' ? -1 : 1;
                    if (aVal > bVal) return this.sortDirection === 'asc' ? 1 : -1;
                    return 0;
                });

                this.filteredItems = filtered;
                this.displayItems();
            }

            displayItems() {
                const tbody = document.getElementById('tableBody');
                
                if (this.filteredItems.length === 0) {
                    tbody.innerHTML = `
                        <tr><td colspan="14" class="empty-state">No items found</td></tr>
                    `;
                    return;
                }

                tbody.innerHTML = this.filteredItems.map(item => {
                    const bought = item.bought_price != null ? `£${parseFloat(item.bought_price).toFixed(2)}` : '-';
                    const sellingRaw = (item.selling_price != null ? item.selling_price : item.price);
                    const selling = sellingRaw != null ? `£${parseFloat(sellingRaw).toFixed(2)}` : '-';
                    
                    const profitMargin = this.calculateProfitMargin(item.bought_price, sellingRaw);
                    const profitClass = this.getProfitMarginClass(item.bought_price, sellingRaw);

                    return `
                    <tr class="${item.is_sold ? 'sold' : ''}" onclick="tableApp.showItemDetails(${item.id})">
                        <td class="id-cell">#${String(item.id).padStart(3, '0')}</td>
                        <td class="name-cell" title="${this.escapeHtml(item.name)}">${this.escapeHtml(item.name)}</td>
                        <td title="${this.escapeHtml(item.color)}">${this.escapeHtml(item.color)}</td>
                        <td>${this.escapeHtml(item.size)}</td>
                        <td class="hide-mobile" title="${this.escapeHtml(item.brand || 'N/A')}">${this.escapeHtml(item.brand || 'N/A')}</td>
                        <td class="price-cell" style="color: #e74c3c;">${bought}</td>
                        <td class="price-cell" style="color: #2ecc71;">${selling}</td>
                        <td class="profit-margin-cell">
                            ${profitMargin ? `<span class="${profitClass}">${profitMargin}</span>` : '-'}
                        </td>
                        <td class="hide-mobile" title="${this.escapeHtml(item.condition_item || 'N/A')}">${this.escapeHtml(item.condition_item || 'N/A')}</td>
                        <td class="hide-mobile" title="${this.escapeHtml(item.location || 'N/A')}">${this.escapeHtml(item.location || 'N/A')}</td>
                        <td class="hide-mobile" title="${this.escapeHtml(item.season || 'N/A')}">${this.escapeHtml(item.season || 'N/A')}</td>
                        <td class="hide-mobile" title="${this.escapeHtml(item.platform || 'Vinted')}">${this.escapeHtml(item.platform || 'Vinted')}</td>
                        <td class="status-cell">
                            <span class="status-badge ${item.is_sold ? 'status-sold' : 'status-available'}">
                                ${item.is_sold ? 'SOLD' : 'AVAILABLE'}
                            </span>
                        </td>
                        <td class="hide-mobile">${this.escapeHtml(item.date_added)}</td>
                    </tr>
                `;
                }).join('');
            }

            sortTable(column) {
                if (this.sortColumn === column) {
                    this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
                } else {
                    this.sortColumn = column;
                    this.sortDirection = 'asc';
                }

                document.querySelectorAll('.sort-indicator').forEach(indicator => {
                    indicator.classList.remove('active');
                    indicator.textContent = '↕️';
                });

                const currentIndicator = document.querySelector(`th[onclick="tableApp.sortTable('${column}')"] .sort-indicator`);
                if (currentIndicator) {
                    currentIndicator.classList.add('active');
                    currentIndicator.textContent = this.sortDirection === 'asc' ? '↑' : '↓';
                }

                this.filterAndDisplayItems();
            }

            async showItemDetails(itemId) {
                try {
                    const item = await this.apiCall(`/items/${itemId}`);
                    this.renderItemModal(item);
                    document.getElementById('itemModal').style.display = 'block';
                } catch (error) {
                    console.error('Failed to load item details:', error);
                }
            }

            renderItemModal(item) {
                const modalTitle = document.getElementById('modalTitle');
                const modalBody = document.getElementById('modalBody');

                modalTitle.textContent = `${item.name} (#${String(item.id).padStart(3, '0')})`;

                const bought = item.bought_price != null ? `£${parseFloat(item.bought_price).toFixed(2)}` : 'Not set';
                const sellingRaw = (item.selling_price != null ? item.selling_price : item.price);
                const selling = sellingRaw != null ? `£${parseFloat(sellingRaw).toFixed(2)}` : 'Not set';
                
                let profitInfo = '';
                if (item.bought_price != null && sellingRaw != null) {
                    const boughtNum = parseFloat(item.bought_price);
                    const sellingNum = parseFloat(sellingRaw);
                    const profitAmount = sellingNum - boughtNum;
                    const profitMargin = boughtNum !== 0 ? ((profitAmount / boughtNum) * 100).toFixed(1) : '∞';
                    
                    const profitClass = profitAmount > 0 ? 'profit-positive' : 
                                       profitAmount < 0 ? 'profit-negative' : 'profit-zero';
                    
                    profitInfo = `
                        <div class="detail-row">
                            <span class="detail-label">Profit:</span>
                            <span class="detail-value">
                                <span class="${profitClass}">£${profitAmount.toFixed(2)} (${profitMargin}%)</span>
                            </span>
                        </div>
                    `;
                }

                modalBody.innerHTML = `
                    <div class="item-detail-grid">
                        <div class="detail-section">
                            <h4>Basic Information</h4>
                            <div class="detail-row">
                                <span class="detail-label">Name:</span>
                                <span class="detail-value">${this.escapeHtml(item.name)}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Color:</span>
                                <span class="detail-value">${this.escapeHtml(item.color)}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Size:</span>
                                <span class="detail-value">${this.escapeHtml(item.size)}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Brand:</span>
                                <span class="detail-value">${this.escapeHtml(item.brand || 'N/A')}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Location:</span>
                                <span class="detail-value">${this.escapeHtml(item.location || 'N/A')}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Season:</span>
                                <span class="detail-value">${this.escapeHtml(item.season || 'N/A')}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Platform:</span>
                                <span class="detail-value">${this.escapeHtml(item.platform || 'Vinted')}</span>
                            </div>
                        </div>

                        <div class="detail-section">
                            <h4>Pricing & Profit</h4>
                            <div class="detail-row">
                                <span class="detail-label">Bought For:</span>
                                <span class="detail-value" style="color: #e74c3c;">${bought}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Selling Price:</span>
                                <span class="detail-value" style="color: #2ecc71;">${selling}</span>
                            </div>
                            ${profitInfo}
                            <div class="detail-row">
                                <span class="detail-label">Condition:</span>
                                <span class="detail-value">${this.escapeHtml(item.condition_item || 'N/A')}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Status:</span>
                                <span class="detail-value">
                                    <span class="status-badge ${item.is_sold ? 'status-sold' : 'status-available'}">
                                        ${item.is_sold ? 'SOLD' : 'AVAILABLE'}
                                    </span>
                                </span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Date Added:</span>
                                <span class="detail-value">${this.escapeHtml(item.date_added)}</span>
                            </div>
                            ${item.is_sold && item.sold_date ? `
                                <div class="detail-row">
                                    <span class="detail-label">Sold Date:</span>
                                    <span class="detail-value">${this.escapeHtml(item.sold_date)}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>

                    ${item.description ? `
                        <div class="description-section">
                            <h4>Description</h4>
                            <p>${this.escapeHtml(item.description)}</p>
                        </div>
                    ` : ''}

                    <div class="qr-section">
                        <h4>QR Code</h4>
                        <div id="modalQR-${item.id}"></div>
                        <p style="color: #666; margin-top: 10px;">Scan to view item details</p>
                    </div>

                    <div class="modal-actions">
                        ${!item.is_sold ? `
                            <button class="btn btn-small btn-success" onclick="tableApp.markAsSold(${item.id}, true)">
                                Mark as Sold
                            </button>
                        ` : `
                            <button class="btn btn-small btn-warning" onclick="tableApp.markAsSold(${item.id}, false)">
                                Mark as Available
                            </button>
                        `}
                        <button class="btn btn-small btn-info" onclick="tableApp.printLabel(${item.id})">
                            Print Label
                        </button>
                        <button class="btn btn-small btn-danger" onclick="tableApp.deleteItem(${item.id})">
                            Delete
                        </button>
                    </div>
                `;

                const qrContainer = document.getElementById(`modalQR-${item.id}`);
                if (qrContainer) {
                    const img = document.createElement('img');
                    const url = `${window.location.origin}/#item-${item.id}`;
                    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(url)}&bgcolor=ffffff&color=333333&margin=10&format=png`;
                    
                    img.src = qrUrl;
                    img.width = 150;
                    img.height = 150;
                    img.alt = `QR Code for item ${item.id}`;
                    img.style.border = '1px solid #ddd';
                    img.style.borderRadius = '8px';
                    qrContainer.appendChild(img);
                }
            }

            async markAsSold(itemId, isSold) {
                try {
                    await this.apiCall(`/items/${itemId}/sold`, {
                        method: 'PATCH',
                        body: JSON.stringify({ is_sold: isSold })
                    });
                    
                    this.closeModal();
                    await this.loadItems();
                    await this.loadStats();
                } catch (error) {
                    console.error('Failed to update item status:', error);
                }
            }

            async deleteItem(itemId) {
                if (!confirm('Are you sure you want to delete this item?')) return;

                try {
                    await this.apiCall(`/items/${itemId}`, { method: 'DELETE' });
                    this.closeModal();
                    await this.loadItems();
                    await this.loadStats();
                } catch (error) {
                    console.error('Failed to delete item:', error);
                }
            }

            async downloadBackup() {
                try {
                    const response = await fetch('/api/backup');
                    if (!response.ok) throw new Error('Backup failed');

                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `vinted-inventory-${new Date().toISOString().split('T')[0]}.db`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                } catch (error) {
                    console.error('Failed to download backup:', error);
                }
            }

            exportToCSV() {
                const headers = ['ID', 'Name', 'Color', 'Size', 'Brand', 'Bought For', 'Selling Price', 'Profit Margin', 'Condition', 'Location', 'Season', 'Platform', 'Status', 'Date Added', 'Sold Date', 'Description'];
                const csvContent = [
                    headers.join(','),
                    ...this.filteredItems.map(item => {
                        const selling = (item.selling_price ?? item.price) ?? '';
                        const bought = item.bought_price ?? '';
                        const profitMargin = this.calculateProfitMargin(item.bought_price, selling);
                        
                        return [
                            item.id,
                            `"${this.escapeCSV(item.name)}"`,
                            `"${this.escapeCSV(item.color)}"`,
                            `"${this.escapeCSV(item.size)}"`,
                            `"${this.escapeCSV(item.brand || '')}"`,
                            bought,
                            selling,
                            `"${profitMargin || ''}"`,
                            `"${this.escapeCSV(item.condition_item || '')}"`,
                            `"${this.escapeCSV(item.location || '')}"`,
                            `"${this.escapeCSV(item.season || '')}"`,
                            `"${this.escapeCSV(item.platform || 'Vinted')}"`,
                            item.is_sold ? 'SOLD' : 'AVAILABLE',
                            `"${this.escapeCSV(item.date_added)}"`,
                            `"${this.escapeCSV(item.sold_date || '')}"`,
                            `"${this.escapeCSV(item.description || '')}"`
                        ].join(',');
                    })
                ].join('\n');

                const blob = new Blob([csvContent], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `vinted-inventory-table-${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }

            printLabel(itemId) {
                window.location.href = `/manage#item-${itemId}`;
            }

            closeModal() {
                document.getElementById('itemModal').style.display = 'none';
            }

            showAddItemModal() {
                document.getElementById('addItemModal').style.display = 'block';
            }

            closeAddItemModal() {
                document.getElementById('addItemModal').style.display = 'none';
                document.getElementById('addItemForm').reset();
            }

            async handleAddItem() {
                const form = document.getElementById('addItemForm');
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());

                Object.keys(data).forEach(key => {
                    if (data[key] === '') {
                        delete data[key];
                    }
                });

                const button = document.getElementById('addItemButton');
                const originalText = button.textContent;
                button.disabled = true;
                button.textContent = 'Adding...';

                try {
                    await this.apiCall('/items', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });

                    this.closeAddItemModal();
                    await this.loadItems();
                    await this.loadStats();
                    this.showNotification('Item added successfully!', 'success');

                } catch (error) {
                    console.error('Failed to add item:', error);
                    this.showNotification('Failed to add item', 'error');
                } finally {
                    button.disabled = false;
                    button.textContent = originalText;
                }
            }

            showNotification(message, type = 'success') {
                const existing = document.querySelectorAll('.notification');
                existing.forEach(n => n.remove());

                const notification = document.createElement('div');
                notification.className = `notification notification-${type}`;
                notification.textContent = message;
                
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    padding: 15px 20px;
                    border-radius: 8px;
                    color: white;
                    font-weight: 600;
                    z-index: 10001;
                    animation: slideInNotification 0.3s ease;
                    max-width: 300px;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                `;

                const colors = {
                    success: '#4CAF50',
                    error: '#f44336',
                    info: '#2196F3'
                };
                notification.style.backgroundColor = colors[type] || colors.info;

                const style = document.createElement('style');
                style.textContent = `
                    @keyframes slideInNotification {
                        from { transform: translateX(100%); opacity: 0; }
                        to { transform: translateX(0); opacity: 1; }
                    }
                `;
                document.head.appendChild(style);

                document.body.appendChild(notification);

                setTimeout(() => {
                    notification.style.animation = 'slideInNotification 0.3s ease reverse';
                    setTimeout(() => notification.remove(), 300);
                }, 3000);
            }

            escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            escapeCSV(text) {
                if (!text) return '';
                return text.toString().replace(/"/g, '""');
            }
        }

        const tableApp = new TableApp();
    </script>
</body>
</html>
