<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinted Inventory System</title>
    <!-- No external QR library needed - using API -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input, select, textarea {
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .database-controls {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .database-controls label {
            color: white;
            font-weight: 600;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .item-card:hover {
            transform: translateY(-5px);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .item-name {
            font-size: 1.2em;
            font-weight: 700;
            color: #333;
        }

        .item-id {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .item-details {
            margin-bottom: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .detail-label {
            font-weight: 600;
            color: #666;
        }

        .detail-value {
            color: #333;
        }

        .qr-section {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .qr-code {
            margin: 10px 0;
        }

        .qr-code img {
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
            flex: 1;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 60px 20px;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            font-size: 1.5em;
        }

        .search-bar {
            width: 100%;
            margin-bottom: 20px;
            padding: 15px;
            border: 2px solid white;
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255,255,255,0.1);
            color: white;
            backdrop-filter: blur(10px);
        }

        .search-bar::placeholder {
            color: rgba(255,255,255,0.8);
        }

        .stats {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
            text-align: center;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2ecc71;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: 600;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            background: #e74c3c;
        }

        .loading {
            text-align: center;
            color: white;
            padding: 20px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2ecc71;
        }

        .status-dot.offline {
            background: #e74c3c;
        }

        .print-only {
            display: none;
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            
            body {
                margin: 0;
                padding: 0;
                background: white !important;
            }
            
            body * {
                visibility: hidden;
            }
            
            .print-label, .print-label * {
                visibility: visible !important;
            }
            
            .print-label {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                height: auto !important;
                background: white !important;
                padding: 15mm !important;
                margin: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                page-break-inside: avoid !important;
                font-size: 12pt !important;
            }
            
            .label-design {
                border: 2px solid #333 !important;
                padding: 15mm !important;
                margin: 0 !important;
                width: auto !important;
                height: auto !important;
                page-break-inside: avoid !important;
                display: block !important;
            }
            
            .label-design h3 {
                font-size: 18pt !important;
                margin: 0 0 10mm 0 !important;
                color: #333 !important;
            }
            
            .label-details {
                font-size: 11pt !important;
                margin: 8mm 0 !important;
                display: block !important;
            }
            
            .label-details div {
                margin: 2mm 0 !important;
                display: block !important;
                width: 100% !important;
            }
            
            .label-qr {
                margin: 8mm 0 !important;
                text-align: center !important;
                page-break-inside: avoid !important;
            }
            
            .label-qr img, .label-qr canvas {
                width: 25mm !important;
                height: 25mm !important;
                max-width: 25mm !important;
                max-height: 25mm !important;
            }
            
            .label-footer {
                font-size: 9pt !important;
                margin-top: 8mm !important;
                padding-top: 5mm !important;
                border-top: 1px solid #333 !important;
            }
            
            .no-print {
                display: none !important;
                visibility: hidden !important;
            }
            
            @page {
                size: auto;
                margin: 10mm;
            }
        }

        .label-preview {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .label-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .label-design {
            border: 2px solid #333;
            padding: 20px;
            text-align: center;
            font-family: 'Arial', sans-serif;
        }

        .label-design h3 {
            margin: 0 0 15px 0;
            font-size: 1.3em;
            color: #333;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .label-details {
            display: block;
            margin: 15px 0;
            font-size: 0.9em;
        }

        .label-details div {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }

        .label-details div:nth-child(odd) {
            background: #f8f9fa;
            padding: 5px;
            border-radius: 3px;
        }

        .label-qr {
            margin: 15px 0;
            display: flex;
            justify-content: center;
        }

        .label-footer {
            font-size: 0.8em;
            color: #666;
            margin-top: 15px;
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Vinted Inventory System</h1>
        
        <!-- Database Controls -->
        <div class="database-controls">
            <label>Database Actions:</label>
            <button class="btn btn-small" onclick="app.downloadBackup()">📥 Download Backup</button>
            <button class="btn btn-small btn-danger" onclick="app.clearDatabase()">🗑️ Clear All Data</button>
            <div id="serverStatus" class="status-indicator" style="margin-left: auto;">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats" id="statsContainer">
            <strong>Total Items: <span id="itemCount">Loading...</span></strong>
        </div>

        <!-- Add Item Form -->
        <div class="form-container">
            <h2 style="margin-bottom: 20px; color: #333;">Add New Item</h2>
            <form id="itemForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="itemName">Item Name *</label>
                        <input type="text" id="itemName" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="itemColor">Color *</label>
                        <input type="text" id="itemColor" name="color" required>
                    </div>
                    <div class="form-group">
                        <label for="itemSize">Size *</label>
                        <select id="itemSize" name="size" required>
                            <option value="">Select Size</option>
                            <option value="XXS">XXS</option>
                            <option value="XS">XS</option>
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                            <option value="XXL">XXL</option>
                            <option value="XXXL">XXXL</option>
                            <option value="One Size">One Size</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="itemBrand">Brand</label>
                        <input type="text" id="itemBrand" name="brand">
                    </div>
                    <div class="form-group">
                        <label for="itemPrice">Price (£)</label>
                        <input type="number" id="itemPrice" name="price" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label for="itemCondition">Condition</label>
                        <select id="itemCondition" name="condition_item">
                            <option value="">Select Condition</option>
                            <option value="New with tags">New with tags</option>
                            <option value="New without tags">New without tags</option>
                            <option value="Very good">Very good</option>
                            <option value="Good">Good</option>
                            <option value="Satisfactory">Satisfactory</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="itemDescription">Description</label>
                    <textarea id="itemDescription" name="description" placeholder="Additional details about the item..."></textarea>
                </div>
                <button type="submit" class="btn" id="addButton">Add Item to Inventory</button>
            </form>
        </div>

        <!-- Search Bar -->
        <input type="text" id="searchBar" class="search-bar" placeholder="🔍 Search items by name, color, size, or brand...">

        <!-- Inventory Display -->
        <div id="inventoryContainer" class="loading">
            Loading inventory...
        </div>

        <!-- Print Label Preview Modal -->
        <div id="labelPreview" class="label-preview" onclick="window.closeLabel(event)">
            <div class="label-content" onclick="event.stopPropagation()">
                <div style="text-align: right; margin-bottom: 20px;">
                    <button class="btn btn-small" id="closeLabelBtn" onclick="window.closeLabel()" style="background: #dc3545;">✖ Close</button>
                </div>
                <div id="labelDesign" class="label-design print-label">
                    <!-- Label content will be inserted here -->
                </div>
                <div style="text-align: center; margin-top: 20px;" class="no-print">
                    <button class="btn" onclick="window.print()">🖨️ Print Label</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast notifications -->
    <div id="toast" class="toast"></div>

    <script>
        console.log('🚀 Script starting...');
        
        class InventoryApp {
            constructor() {
                console.log('🏗️ InventoryApp constructor called');
                this.baseURL = '';
                this.searchTimeout = null;
                this.init();
            }

            async init() {
                console.log('⚡ Starting init...');
                this.bindEvents();
                console.log('🎯 Events bound');
                
                this.checkConnection();
                console.log('📡 Connection check started');
                
                await this.loadInventory();
                console.log('📦 Inventory load completed');
                
                await this.loadStats();
                console.log('📊 Stats load completed');
                
                this.handleDirectItemLink();
                console.log('🔗 Direct link handling completed');
            }

            async checkConnection() {
                console.log('🔍 Checking connection...');
                try {
                    const response = await fetch('/health');
                    if (response.ok) {
                        console.log('✅ Health check passed');
                        this.updateStatus(true);
                    } else {
                        console.log('❌ Health check failed:', response.status);
                        this.updateStatus(false);
                    }
                } catch (error) {
                    console.log('❌ Health check error:', error);
                    this.updateStatus(false);
                }
            }

            updateStatus(isOnline) {
                console.log('🔄 Updating status to:', isOnline);
                const statusDot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');
                
                if (isOnline) {
                    statusDot.classList.remove('offline');
                    statusText.textContent = 'Connected';
                } else {
                    statusDot.classList.add('offline');
                    statusText.textContent = 'Offline';
                }
            }

            bindEvents() {
                console.log('🎯 Binding events...');
                document.getElementById('itemForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addItem();
                });

                document.getElementById('searchBar').addEventListener('input', (e) => {
                    clearTimeout(this.searchTimeout);
                    this.searchTimeout = setTimeout(() => {
                        this.searchItems(e.target.value);
                    }, 300);
                });

                window.addEventListener('hashchange', () => {
                    this.handleDirectItemLink();
                });
            }

            async apiCall(endpoint, options = {}) {
                console.log('📡 API Call to:', endpoint, 'with options:', options);
                try {
                    const response = await fetch(`${this.baseURL}/api${endpoint}`, {
                        headers: {
                            'Content-Type': 'application/json',
                            ...options.headers
                        },
                        ...options
                    });

                    console.log('📡 API Response status:', response.status, response.ok);

                    if (!response.ok) {
                        const error = await response.json().catch(() => ({ error: 'Network error' }));
                        console.error('📡 API Error response:', error);
                        throw new Error(error.error || `HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    console.log('📡 API Response data:', data);
                    return data;
                } catch (error) {
                    console.error('❌ API Call error:', error);
                    this.showToast(error.message, 'error');
                    this.updateStatus(false);
                    throw error;
                }
            }

            async addItem() {
                console.log('➕ Adding item...');
                const form = document.getElementById('itemForm');
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());

                Object.keys(data).forEach(key => {
                    if (data[key] === '') {
                        delete data[key];
                    }
                });

                console.log('➕ Item data to add:', data);

                const button = document.getElementById('addButton');
                button.disabled = true;
                button.textContent = 'Adding...';

                try {
                    const result = await this.apiCall('/items', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });

                    console.log('✅ Item added successfully:', result);
                    form.reset();
                    this.showToast('Item added successfully!');
                    await this.loadInventory();
                    await this.loadStats();

                    setTimeout(() => {
                        const element = document.getElementById(`item-${result.id}`);
                        if (element) {
                            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 100);
                } catch (error) {
                    console.error('❌ Failed to add item:', error);
                } finally {
                    button.disabled = false;
                    button.textContent = 'Add Item to Inventory';
                }
            }

            async deleteItem(id) {
                console.log('🗑️ Deleting item:', id);
                if (!confirm('Are you sure you want to delete this item?')) return;

                try {
                    await this.apiCall(`/items/${id}`, { method: 'DELETE' });
                    this.showToast('Item deleted successfully!');
                    await this.loadInventory();
                    await this.loadStats();
                } catch (error) {
                    console.error('❌ Failed to delete item:', error);
                }
            }

            async loadInventory(search = '') {
                console.log('🔍 Starting loadInventory, search:', search);
                try {
                    const params = search ? `?search=${encodeURIComponent(search)}` : '';
                    console.log('📡 Making API call to:', `/api/items${params}`);
                    
                    const items = await this.apiCall(`/items${params}`);
                    console.log('✅ API response received:', items);
                    console.log('📊 Number of items:', items.length);
                    
                    this.renderInventory(items);
                    console.log('🎨 Render completed');
                    
                    this.updateStatus(true);
                    console.log('🔄 Status updated to online');
                    
                } catch (error) {
                    console.error('❌ Load inventory error:', error);
                    console.error('❌ Error details:', error.message, error.stack);
                    
                    document.getElementById('inventoryContainer').innerHTML = `
                        <div class="empty-state">
                            <h3>Error loading inventory</h3>
                            <p>Please check your connection and try refreshing the page.</p>
                        </div>
                    `;
                }
            }

            async loadStats() {
                console.log('📊 Loading stats...');
                try {
                    const stats = await this.apiCall('/stats');
                    console.log('📊 Stats received:', stats);
                    document.getElementById('itemCount').textContent = stats.totalItems;
                } catch (error) {
                    console.error('❌ Stats load error:', error);
                    document.getElementById('itemCount').textContent = 'Error';
                }
            }

            async searchItems(searchTerm) {
                console.log('🔍 Searching for:', searchTerm);
                await this.loadInventory(searchTerm);
            }

            async downloadBackup() {
                console.log('📥 Downloading backup...');
                try {
                    const response = await fetch('/api/backup');
                    if (!response.ok) throw new Error('Backup failed');

                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `vinted-inventory-${new Date().toISOString().split('T')[0]}.db`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);

                    this.showToast('Database backup downloaded successfully!');
                } catch (error) {
                    console.error('❌ Backup download error:', error);
                    this.showToast('Failed to download backup', 'error');
                }
            }

            async clearDatabase() {
                console.log('🗑️ Clearing database...');
                if (!confirm('Are you sure you want to clear all items? This cannot be undone!')) return;
                if (!confirm('This will permanently delete ALL your inventory data. Are you absolutely sure?')) return;

                try {
                    await this.apiCall('/clear', { method: 'DELETE' });
                    this.showToast('Database cleared successfully!');
                    await this.loadInventory();
                    await this.loadStats();
                } catch (error) {
                    console.error('❌ Clear database error:', error);
                }
            }

            generateQRCode(item) {
                console.log('🔳 Generating QR code via QR Server API for item:', item.id);
                const img = document.createElement('img');
                const url = `${window.location.origin}/#item-${item.id}`;
                
                // Use QR Server API instead of Google Charts
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(url)}&bgcolor=ffffff&color=333333&margin=10&format=png`;
                
                img.src = qrUrl;
                img.width = 150;
                img.height = 150;
                img.alt = `QR Code for item ${item.id}`;
                img.style.border = '1px solid #ddd';
                img.style.borderRadius = '8px';
                img.loading = 'lazy'; // Improve performance
                
                // Add error handling for failed image loads
                img.onerror = function() {
                    console.error('❌ QR Code API failed for item:', item.id);
                    console.log('🔄 Trying Google Charts as fallback...');
                    
                    // Try Google Charts as fallback
                    const fallbackUrl = `https://chart.googleapis.com/chart?chs=150x150&cht=qr&chl=${encodeURIComponent(url)}&chld=M|0`;
                    img.src = fallbackUrl;
                    
                    // If that also fails, show canvas placeholder
                    img.onerror = function() {
                        console.error('❌ All QR APIs failed for item:', item.id);
                        // Create fallback canvas
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 150;
                        canvas.height = 150;
                        canvas.style.border = '1px solid #ddd';
                        canvas.style.borderRadius = '8px';
                        
                        // Create gradient background
                        const gradient = ctx.createLinearGradient(0, 0, 150, 150);
                        gradient.addColorStop(0, '#f8f9fa');
                        gradient.addColorStop(1, '#e9ecef');
                        ctx.fillStyle = gradient;
                        ctx.fillRect(0, 0, 150, 150);
                        
                        // Add border
                        ctx.strokeStyle = '#dee2e6';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(1, 1, 148, 148);
                        
                        // Add text content
                        ctx.fillStyle = '#495057';
                        ctx.font = 'bold 16px system-ui, -apple-system, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('QR CODE', 75, 45);
                        
                        ctx.font = 'bold 18px system-ui, -apple-system, sans-serif';
                        ctx.fillStyle = '#667eea';
                        ctx.fillText(`#${String(item.id).padStart(3, '0')}`, 75, 70);
                        
                        ctx.font = '11px system-ui, -apple-system, sans-serif';
                        ctx.fillStyle = '#6c757d';
                        ctx.fillText('Use "Copy Link" button', 75, 95);
                        ctx.fillText('to share this item', 75, 110);
                        
                        // Add QR-like pattern for visual appeal
                        ctx.fillStyle = '#dee2e6';
                        const patternSize = 3;
                        for (let i = 0; i < 3; i++) {
                            for (let j = 0; j < 3; j++) {
                                if ((i + j) % 2 === 0) {
                                    ctx.fillRect(20 + i * patternSize, 120 + j * patternSize, patternSize, patternSize);
                                    ctx.fillRect(120 + i * patternSize, 120 + j * patternSize, patternSize, patternSize);
                                    ctx.fillRect(20 + i * patternSize, 20 + j * patternSize, patternSize, patternSize);
                                }
                            }
                        }
                        
                        // Replace the failed image with canvas
                        if (img.parentNode) {
                            img.parentNode.replaceChild(canvas, img);
                        }
                    };
                };
                
                console.log('✅ QR Server API URL generated for item:', item.id);
                return img;
            }

            renderInventory(items) {
                console.log('🎨 Starting renderInventory with', items.length, 'items');
                const container = document.getElementById('inventoryContainer');
                console.log('🎨 Container found:', !!container);
                
                if (items.length === 0) {
                    console.log('📋 No items to display');
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>No items found</h3>
                            <p>Try adding some items or adjusting your search terms.</p>
                        </div>
                    `;
                    return;
                }

                console.log('🎨 Generating HTML for', items.length, 'items');
                const itemsHTML = items.map(item => {
                    return `
                        <div class="item-card" id="item-${item.id}">
                            <div class="item-header">
                                <div class="item-name">${this.escapeHtml(item.name)}</div>
                                <div class="item-id">#${String(item.id).padStart(3, '0')}</div>
                            </div>
                            
                            <div class="item-details">
                                <div class="detail-row">
                                    <span class="detail-label">Color:</span>
                                    <span class="detail-value">${this.escapeHtml(item.color)}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Size:</span>
                                    <span class="detail-value">${this.escapeHtml(item.size)}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Brand:</span>
                                    <span class="detail-value">${this.escapeHtml(item.brand || 'N/A')}</span>
                                </div>
                                ${item.price ? `
                                    <div class="detail-row">
                                        <span class="detail-label">Price:</span>
                                        <span class="detail-value">£${parseFloat(item.price).toFixed(2)}</span>
                                    </div>
                                ` : ''}
                                ${item.condition_item ? `
                                    <div class="detail-row">
                                        <span class="detail-label">Condition:</span>
                                        <span class="detail-value">${this.escapeHtml(item.condition_item)}</span>
                                    </div>
                                ` : ''}
                                <div class="detail-row">
                                    <span class="detail-label">Added:</span>
                                    <span class="detail-value">${this.escapeHtml(item.date_added)}</span>
                                </div>
                                ${item.description ? `
                                    <div class="detail-row" style="margin-top: 10px;">
                                        <span class="detail-label">Description:</span>
                                    </div>
                                    <div style="margin-top: 5px; color: #666; font-style: italic;">
                                        ${this.escapeHtml(item.description)}
                                    </div>
                                ` : ''}
                            </div>
                            
                            <div class="qr-section">
                                <div class="qr-code" id="qr-${item.id}"></div>
                                <div style="font-size: 0.9em; color: #666;">
                                    Scan to view item details
                                </div>
                            </div>
                            
                            <div class="actions">
                                <button class="btn btn-small" onclick="app.printLabel(${item.id})" style="background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);">
                                    🏷️ Print Label
                                </button>
                                <button class="btn btn-small btn-danger" onclick="app.deleteItem(${item.id})">
                                    🗑️ Delete
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');

                console.log('🎨 Setting innerHTML with grid');
                container.innerHTML = `<div class="inventory-grid">${itemsHTML}</div>`;

                console.log('🔳 Adding QR codes...');
                // Add QR codes after DOM is updated
                items.forEach(item => {
                    const qrContainer = document.getElementById(`qr-${item.id}`);
                    if (qrContainer) {
                        const qrElement = this.generateQRCode(item);
                        qrContainer.appendChild(qrElement);
                    } else {
                        console.error('❌ QR container not found for item:', item.id);
                    }
                });

                console.log('🎨 Render completed, handling direct links');
                this.handleDirectItemLink();
            }

            escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            copyItemURL(id) {
                console.log('📋 Copying URL for item:', id);
                const url = `${window.location.origin}/#item-${id}`;
                navigator.clipboard.writeText(url).then(() => {
                    const button = event.target;
                    const originalText = button.innerHTML;
                    button.innerHTML = '✅ Copied!';
                    button.style.background = '#2ecc71';
                    
                    setTimeout(() => {
                        button.innerHTML = originalText;
                        button.style.background = '';
                    }, 2000);
                }).catch(() => {
                    this.showToast('Failed to copy URL', 'error');
                });
            }

            async handleDirectItemLink() {
                const hash = window.location.hash;
                if (hash.startsWith('#item-')) {
                    const itemId = parseInt(hash.replace('#item-', ''));
                    console.log('🔗 Handling direct link to item:', itemId);
                    
                    // Load and show single item view
                    await this.showSingleItemView(itemId);
                }
            }

            async showSingleItemView(itemId) {
                console.log('👁️ Showing single item view for:', itemId);
                
                try {
                    // Fetch the specific item
                    const item = await this.apiCall(`/items/${itemId}`);
                    console.log('✅ Single item loaded:', item);
                    
                    // Hide all other UI elements
                    document.querySelector('h1').style.display = 'none';
                    document.querySelector('.database-controls').style.display = 'none';
                    document.querySelector('.stats').style.display = 'none';
                    document.querySelector('.form-container').style.display = 'none';
                    document.querySelector('.search-bar').style.display = 'none';
                    
                    // Create single item view
                    this.renderSingleItem(item);
                    
                } catch (error) {
                    console.error('❌ Failed to load single item:', error);
                    // Show error and return to full view
                    this.showToast('Item not found', 'error');
                    this.showFullView();
                }
            }

            showFullView() {
                console.log('🔙 Showing full view');
                
                // Show all UI elements
                document.querySelector('h1').style.display = 'block';
                document.querySelector('.database-controls').style.display = 'flex';
                document.querySelector('.stats').style.display = 'block';
                document.querySelector('.form-container').style.display = 'block';
                document.querySelector('.search-bar').style.display = 'block';
                
                // Clear hash and reload inventory
                window.history.pushState("", document.title, window.location.pathname);
                this.loadInventory();
            }

            renderSingleItem(item) {
                console.log('🎨 Rendering single item view');
                const container = document.getElementById('inventoryContainer');
                
                container.innerHTML = `
                    <div style="max-width: 500px; margin: 0 auto;">
                        <div style="text-align: center; margin-bottom: 30px;">
                            <button class="btn" onclick="app.showFullView()" style="margin-bottom: 20px;">
                                ← Back to Full Inventory
                            </button>
                            <h2 style="color: white; margin-bottom: 10px;">Item Details</h2>
                        </div>
                        
                        <div class="item-card" style="margin: 0 auto; box-shadow: 0 20px 40px rgba(0,0,0,0.2);">
                            <div class="item-header">
                                <div class="item-name" style="font-size: 1.5em;">${this.escapeHtml(item.name)}</div>
                                <div class="item-id" style="font-size: 1em;">#${String(item.id).padStart(3, '0')}</div>
                            </div>
                            
                            <div class="item-details" style="margin-bottom: 25px;">
                                <div class="detail-row" style="margin-bottom: 12px;">
                                    <span class="detail-label" style="font-size: 1.1em;">Color:</span>
                                    <span class="detail-value" style="font-size: 1.1em; font-weight: 600;">${this.escapeHtml(item.color)}</span>
                                </div>
                                <div class="detail-row" style="margin-bottom: 12px;">
                                    <span class="detail-label" style="font-size: 1.1em;">Size:</span>
                                    <span class="detail-value" style="font-size: 1.1em; font-weight: 600;">${this.escapeHtml(item.size)}</span>
                                </div>
                                <div class="detail-row" style="margin-bottom: 12px;">
                                    <span class="detail-label" style="font-size: 1.1em;">Brand:</span>
                                    <span class="detail-value" style="font-size: 1.1em; font-weight: 600;">${this.escapeHtml(item.brand || 'N/A')}</span>
                                </div>
                                ${item.price ? `
                                    <div class="detail-row" style="margin-bottom: 12px;">
                                        <span class="detail-label" style="font-size: 1.1em;">Price:</span>
                                        <span class="detail-value" style="font-size: 1.2em; font-weight: bold; color: #2ecc71;">£${parseFloat(item.price).toFixed(2)}</span>
                                    </div>
                                ` : ''}
                                ${item.condition_item ? `
                                    <div class="detail-row" style="margin-bottom: 12px;">
                                        <span class="detail-label" style="font-size: 1.1em;">Condition:</span>
                                        <span class="detail-value" style="font-size: 1.1em; font-weight: 600;">${this.escapeHtml(item.condition_item)}</span>
                                    </div>
                                ` : ''}
                                <div class="detail-row" style="margin-bottom: 12px;">
                                    <span class="detail-label" style="font-size: 1.1em;">Added:</span>
                                    <span class="detail-value" style="font-size: 1.1em;">${this.escapeHtml(item.date_added)}</span>
                                </div>
                                ${item.description ? `
                                    <div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #667eea;">
                                        <div style="font-weight: 600; color: #495057; margin-bottom: 8px;">Description:</div>
                                        <div style="color: #6c757d; line-height: 1.5;">
                                            ${this.escapeHtml(item.description)}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                            
                            <div class="qr-section" style="border-top: 2px solid #e9ecef; padding-top: 20px;">
                                <div class="qr-code" id="single-qr-${item.id}"></div>
                                <div style="font-size: 0.9em; color: #666; margin-top: 10px;">
                                    Share this QR code to show others this item
                                </div>
                            </div>
                            
                            <div class="actions" style="margin-top: 25px;">
                                <button class="btn" onclick="app.printLabel(${item.id})" style="flex: 1; background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);">
                                    🏷️ Print Label
                                </button>
                                <button class="btn" onclick="app.showFullView()" style="flex: 1;">
                                    📋 View All
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                // Add QR code for single item
                const qrContainer = document.getElementById(`single-qr-${item.id}`);
                if (qrContainer) {
                    const qrElement = this.generateQRCode(item);
                    qrContainer.appendChild(qrElement);
                }
            }

            async printLabel(itemId) {
                console.log('🏷️ Preparing to print label for item:', itemId);
                
                try {
                    // Fetch the specific item
                    const item = await this.apiCall(`/items/${itemId}`);
                    console.log('✅ Item loaded for label:', item);
                    
                    this.showLabelPreview(item);
                    
                } catch (error) {
                    console.error('❌ Failed to load item for label:', error);
                    this.showToast('Failed to load item details', 'error');
                }
            }

            showLabelPreview(item) {
                console.log('🏷️ Showing label preview for:', item.name);
                
                const labelDesign = document.getElementById('labelDesign');
                const labelPreview = document.getElementById('labelPreview');
                
                // Create the label content with full details for preview
                labelDesign.innerHTML = `
                    <h3>${this.escapeHtml(item.name)}</h3>
                    <div class="label-details">
                        <div><strong>Item #:</strong> <span>${String(item.id).padStart(3, '0')}</span></div>
                        <div><strong>Size:</strong> <span>${this.escapeHtml(item.size)}</span></div>
                        <div><strong>Color:</strong> <span>${this.escapeHtml(item.color)}</span></div>
                        <div><strong>Brand:</strong> <span>${this.escapeHtml(item.brand || 'N/A')}</span></div>
                        ${item.price ? `<div><strong>Price:</strong> <span>£${parseFloat(item.price).toFixed(2)}</span></div>` : ''}
                        ${item.condition_item ? `<div><strong>Condition:</strong> <span>${this.escapeHtml(item.condition_item)}</span></div>` : ''}
                    </div>
                    ${item.description ? `
                        <div style="margin: 10px 0; font-size: 10px; color: #666; text-align: left; padding: 8px; background: #f8f9fa; border-radius: 5px;">
                            <strong>Notes:</strong> ${this.escapeHtml(item.description)}
                        </div>
                    ` : ''}
                    <div class="label-qr" id="label-qr-${item.id}">
                        <!-- QR code will be inserted here -->
                    </div>
                    <div class="label-footer">
                        <div><strong>Added:</strong> ${this.escapeHtml(item.date_added)}</div>
                        <div style="margin-top: 3px; font-style: italic;">Scan QR code to view online</div>
                        <div style="margin-top: 3px; font-size: 9px; color: #999;">Prints as 5cm x 5cm label</div>
                    </div>
                `;
                
                // Add QR code to label
                const qrContainer = document.getElementById(`label-qr-${item.id}`);
                if (qrContainer) {
                    const qrElement = this.generateQRCode(item);
                    // Normal size for preview, will be made smaller when printing
                    if (qrElement.tagName === 'IMG') {
                        qrElement.width = 80;
                        qrElement.height = 80;
                    } else if (qrElement.tagName === 'CANVAS') {
                        qrElement.width = 80;
                        qrElement.height = 80;
                        qrElement.style.width = '80px';
                        qrElement.style.height = '80px';
                    }
                    qrContainer.appendChild(qrElement);
                }
                
                // Show the preview modal
                labelPreview.style.display = 'flex';
            }

            showToast(message, type = 'success') {
                console.log('🍞 Showing toast:', message, type);
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast ${type}`;
                toast.classList.add('show');

                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
        }

        // Global function to close label preview
        window.closeLabel = function(event) {
            console.log('🏷️ Global close label function called');
            if (event && event.target.id !== 'labelPreview' && event.target.id !== 'closeLabelBtn') {
                return; // Only close if clicking background or close button
            }
            const labelPreview = document.getElementById('labelPreview');
            if (labelPreview) {
                labelPreview.style.display = 'none';
            }
        };

        // Initialize the application
        console.log('🚀 Creating InventoryApp instance...');
        const app = new InventoryApp();
        console.log('🚀 App initialized!');
    </script>
</body>
</html>
