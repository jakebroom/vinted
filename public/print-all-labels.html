<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print labels · NewStart Retail</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="shared.css">
    <style>
        .label-table {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xs);
            overflow: hidden;
        }

        .label-table th:first-child,
        .label-table td:first-child {
            width: 44px;
            text-align: center;
        }

        .label-table input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--color-primary);
            vertical-align: middle;
        }

        .label-table .item-number {
            font-family: var(--font-mono);
            font-size: var(--font-size-sm);
        }

        .label-table .item-name {
            font-weight: var(--font-weight-medium);
            color: var(--color-text);
        }

        .label-table .price {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .status {
            color: var(--color-text-muted);
            font-size: var(--font-size-sm);
        }

        .no-items {
            text-align: center;
            padding: var(--space-2xl);
            color: var(--color-text-muted);
        }

        .selection-bar {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            flex-wrap: wrap;
            margin-bottom: var(--space-md);
        }

        .selection-bar .status {
            margin-left: auto;
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="app-header-inner">
            <a href="/" class="brand"><span class="brand-mark">NR</span>NewStart Retail</a>
            <nav class="app-nav" aria-label="Main">
                <a href="/" class="app-nav-link">Inventory</a>
                <a href="/manage" class="app-nav-link">Management</a>
                <a href="/insights" class="app-nav-link">Insights</a>
            </nav>
            <div class="app-actions">
                <button class="btn" id="exportBtn" onclick="exportToPDF()" disabled>Export selected as PDF</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Print labels</h1>
                <p class="page-subtitle">Choose the available items you want labels for, then export them as a PDF for your label printer.</p>
            </div>
            <div class="page-actions">
                <a href="/" class="btn btn-secondary">Back to inventory</a>
            </div>
        </div>

        <div class="selection-bar">
            <button class="btn btn-secondary btn-small" onclick="selectAll()">Select all</button>
            <button class="btn btn-secondary btn-small" onclick="deselectAll()">Deselect all</button>
            <div class="status" id="status">Loading items...</div>
        </div>

        <div class="label-table" id="itemsTable">
            <!-- Table will be loaded here -->
        </div>
    </div>

    <script>
        let allItems = [];

        function selectAll() {
            document.querySelectorAll('.item-checkbox').forEach(cb => cb.checked = true);
            updateSelection();
        }

        function deselectAll() {
            document.querySelectorAll('.item-checkbox').forEach(cb => cb.checked = false);
            updateSelection();
        }

        function updateSelection() {
            const selectedCount = document.querySelectorAll('.item-checkbox:checked').length;
            const totalCount = document.querySelectorAll('.item-checkbox').length;
            document.getElementById('status').textContent = `${selectedCount} of ${totalCount} items selected`;
            document.getElementById('exportBtn').disabled = selectedCount === 0;
            const master = document.getElementById('selectAllCheckbox');
            if (master) master.checked = totalCount > 0 && selectedCount === totalCount;
        }

        async function exportToPDF() {
            const selectedCheckboxes = document.querySelectorAll('.item-checkbox:checked');
            const selectedIds = Array.from(selectedCheckboxes).map(cb => parseInt(cb.value));

            if (selectedIds.length === 0) {
                alert('Please select at least one item to export');
                return;
            }

            try {
                document.getElementById('status').textContent = `Generating PDF for ${selectedIds.length} labels...`;
                document.getElementById('exportBtn').disabled = true;

                const response = await fetch('/api/export/labels-pdf', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ itemIds: selectedIds })
                });

                if (!response.ok) {
                    throw new Error('Failed to generate PDF');
                }

                // Download the PDF
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `labels-${new Date().toISOString().split('T')[0]}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);

                document.getElementById('status').textContent = `PDF generated with ${selectedIds.length} labels`;
                document.getElementById('exportBtn').disabled = false;

            } catch (error) {
                console.error('Error exporting PDF:', error);
                alert('Failed to export PDF: ' + error.message);
                updateSelection();
            }
        }

        async function loadAllItems() {
            try {
                const statusEl = document.getElementById('status');
                statusEl.textContent = 'Loading items...';

                // Fetch all available items
                const response = await fetch('/api/items?status=available');
                if (!response.ok) throw new Error('Failed to load items');

                allItems = await response.json();

                const container = document.getElementById('itemsTable');

                if (allItems.length === 0) {
                    statusEl.textContent = 'No available items found';
                    container.innerHTML = '<div class="no-items">No available items to export</div>';
                    return;
                }

                // Build table
                let tableHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>
                                    <input type="checkbox" id="selectAllCheckbox" onchange="toggleAll(this)" aria-label="Select all">
                                </th>
                                <th>Item #</th>
                                <th>Name</th>
                                <th>Brand</th>
                                <th>Size</th>
                                <th>Color</th>
                                <th class="price">Price</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                allItems.forEach(item => {
                    const itemNumber = item.item_number || ('#' + String(item.id).padStart(3, '0'));
                    const price = item.sold_for_price || item.price;
                    const priceFormatted = price ? '£' + parseFloat(price).toFixed(2) : '-';

                    tableHTML += `
                        <tr>
                            <td>
                                <input type="checkbox" class="item-checkbox" value="${item.id}" onchange="updateSelection()" aria-label="Select ${escapeHtml(item.name)}">
                            </td>
                            <td class="item-number">${escapeHtml(itemNumber)}</td>
                            <td class="item-name">${escapeHtml(item.name)}</td>
                            <td>${escapeHtml(item.brand || 'N/A')}</td>
                            <td>${escapeHtml(item.size)}</td>
                            <td>${escapeHtml(item.color)}</td>
                            <td class="price">${priceFormatted}</td>
                        </tr>
                    `;
                });

                tableHTML += `
                        </tbody>
                    </table>
                `;

                container.innerHTML = tableHTML;
                statusEl.textContent = `0 of ${allItems.length} items selected`;

            } catch (error) {
                console.error('Error loading items:', error);
                document.getElementById('status').textContent = 'Error loading items';
                document.getElementById('itemsTable').innerHTML = '<div class="no-items">Failed to load items</div>';
            }
        }

        function toggleAll(checkbox) {
            document.querySelectorAll('.item-checkbox').forEach(cb => cb.checked = checkbox.checked);
            updateSelection();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load items when page loads
        window.onload = loadAllItems;
    </script>
</body>
</html>
